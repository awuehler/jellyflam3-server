name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Exec bits check
        run: bash scripts/ensure_exec_bits.sh --check

      - name: Pytest
        run: python -m pytest tests/ -q --tb=short

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build generic client packages
        run: |
          bash scripts/package_roku_channel.sh
          bash scripts/package_roku_screensaver.sh
          bash scripts/package_kodi_screensaver.sh
          ls -la dist/

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="[$TAG]" '
            /^## \[/ {
              if (found) exit
              if (index($0, tag)) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section for ${TAG}" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/jellyflam3-roku.zip
            dist/jellyflam3-screensaver.zip
            dist/screensaver.jellyflam3.zip
